name: invidious

image:
  repository: quay.io/invidious/invidious
  tag: latest
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Setting replicaCount higher than 1 may cause PostgreSQL database deadlocks.
# This happens when multiple Invidious processes simultaneously attempt to refresh channel subscriptions for users.
replicaCount: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 16
  targetCPUUtilizationPercentage: 50

service:
  type: ClusterIP
  port: 3000
  # loadBalancerIP:

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 64Mi
  # limits:
  #   cpu: 800m
  #   memory: 512Mi

deploymentLabels: {}

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}

tolerations: []

affinity: {}


# Reference: https://github.com/bitnami/charts/tree/main/bitnami/postgresql
postgresql:
  enabled: true
  image:
    tag: 16
  auth:
    username: kemal
    password: kemal
    database: invidious

# Reference: https://github.com/iv-org/invidious/blob/master/config/config.example.yml
config:
  # Database configuration using a single URI, an alternative to 'db'.
  # Mutually exclusive with 'db' - setting both will fail templating.
  # Example: postgres://kemal:kemal@invidious-postgresql:5432/invidious
  database_url: ""
  # Database configuration with separate parameters.
  # When 'postgresql.enabled' is true, missing values are derived
  # from 'postgresql.auth'. When 'postgresql.enabled' is false,
  # user, password, host and dbname are all required.
  # db:
  #   user: kemal
  #   password: kemal
  #   host: invidious-postgresql
  #   port: 5432
  #   dbname: invidious
  port: 3000
  domain: ""
  https_only: false
  channel_threads: 1
  full_refresh: false
  feed_threads: 1

env: []

# invidious-companion sidecar (replaces inv-sig-helper)
# Reference: https://github.com/iv-org/invidious-companion
companion:
  enabled: false
  image:
    repository: quay.io/invidious/invidious-companion
    tag: latest
    pullPolicy: IfNotPresent
  # Secret key shared between invidious and the companion (SERVER_SECRET_KEY).
  # Required when companion is enabled; must be exactly 16 characters.
  secretKey: ""
  # Service for the companion. Keep ClusterIP and expose it via the ingress below;
  # only change this if you expose the companion without an ingress.
  service:
    type: ClusterIP
  # Ingress exposing the companion publicly
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: companion-example.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  resources: {}
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# SecurityContext applied to the chart's init containers
initContainersSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

automountServiceAccountToken: false

podAnnotations: {}

podLabels: {}

# Probes are merged with these defaults: overriding with a different handler
# (e.g. tcpSocket) keeps the default httpGet too, which Kubernetes rejects.
# Explicitly null the default handler when switching, e.g.:
#   probes:
#     readiness:
#       httpGet: null
#       tcpSocket:
#         port: http
# Set a probe to null (e.g. `probes: {startup: null}`) to disable it.
probes:
  readiness:
    httpGet:
      port: http
      path: /
  liveness:
    httpGet:
      port: http
      path: /
  startup:
    httpGet:
      port: http
      path: /
    periodSeconds: 5
    failureThreshold: 30

sighelper:
  enabled: true
  resources: {}
  service:
    port: 12999
  image:
    repository: quay.io/invidious/inv-sig-helper
    tag: latest
    pullPolicy: Always
  env: []
